memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 8M
post_max_size = 10M
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
